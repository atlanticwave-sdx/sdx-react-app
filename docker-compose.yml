services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      sdx-network:
      kytos_network:
        ipv4_address: 192.168.0.6
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-3004}:${BACKEND_PORT:-3004}"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=${BACKEND_PORT:-3004}
      - CORS_ORIGINS=https://sdxapi.atlanticwave-sdx.net,http://localhost,http://frontend
    networks:
      - sdx-network

networks:
  sdx-network:
    driver: bridge
  kytos_network:
    external: true
