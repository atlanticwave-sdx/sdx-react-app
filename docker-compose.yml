services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - sdx-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-3004}:${BACKEND_PORT:-3004}"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=${BACKEND_PORT:-3004}
      - CORS_ORIGINS=https://sdxapi.atlanticwave-sdx.net,http://localhost,http://frontend
    extra_hosts:
      - "sdxapi.atlanticwave-sdx.ai:190.103.184.197"
    networks:
      - sdx-network

networks:
  sdx-network:
    driver: bridge
